; =====================================================================
; platformio.ini -- programme principal du boîtier (Edge Energy Manager)
; PlatformIO lit ce fichier pour savoir : quelle carte, quelles
; bibliothèques télécharger, et comment parler au port série.
; =====================================================================
[env:esp32dev]
; famille de puces, carte (ESP32 DevKit V1) et fonctions Arduino
platform = espressif32
board = esp32dev
framework = arduino

; Bibliothèques téléchargées automatiquement à la première compilation.
; OneWire et DallasTemperature ne servent que si TEMP_SENSOR_DHT11 = 0.
lib_deps =
    adafruit/Adafruit INA219
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    knolleary/PubSubClient
    bblanchon/ArduinoJson@^7
    paulstoffregen/OneWire
    milesburton/DallasTemperature

; Moniteur série : 115200 bauds. send_on_enter permet de taper les
; commandes (info, pause=60, annonce=...) puis Entrée pour les envoyer.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, send_on_enter
monitor_echo = yes
monitor_eol = LF
upload_speed = 460800
